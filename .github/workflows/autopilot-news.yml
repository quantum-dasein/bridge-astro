# Публикует на сайте статьи, которые подготовил редакционный бот (Bridge Consult · SMM Studio).
# Бот пишет статью на трёх языках и рисует картинки; этот процесс дважды в час проверяет,
# появилось ли что-то новое, собирает сайт для проверки и отправляет коммит — дальше Vercel публикует сам.
name: Autopilot news

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopilot-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Is there anything new?
        id: feed
        run: node scripts/pull-articles.mjs --check

      - name: Install dependencies
        if: steps.feed.outputs.changed == 'true'
        run: npm ci

      - name: Add articles and optimise images
        if: steps.feed.outputs.changed == 'true'
        run: node scripts/pull-articles.mjs

      # Если статья ломает сборку, коммита не будет и сайт останется как был.
      - name: Build the site to make sure nothing breaks
        if: steps.feed.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push
        if: steps.feed.outputs.changed == 'true'
        run: |
          git config user.name "quantum-dasein"
          git config user.email "100032901+quantum-dasein@users.noreply.github.com"
          git add src/content/news public/media/news public/sitemap.xml
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -F .autopilot-message
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
